spring.config.import=optional:file:.env[.properties]
spring.application.name=backend
server.port=${SERVER_PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hospital_management_db}
spring.data.mongodb.database=${MONGODB_DATABASE:hospital_management_db}

logging.level.org.springframework.security=DEBUG

# JWT Configuration
jwt.secret=${JWT_SECRET:change-me-to-a-secure-secret-key}
jwt.expiration=${JWT_EXPIRATION:86400000}

# WebSocket Configuration
spring.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:*}

# CORS Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Password reset email (set MAIL_ENABLED=true and provide SMTP values in production)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:janukaruna2003@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
